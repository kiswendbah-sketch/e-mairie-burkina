<!DOCTYPE html>
<html>
<head>
    <title>Mes demandes</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-4">

<h2>Mes demandes</h2>

<table class="table table-bordered">
    <thead>
        <tr>
            <th>ID</th>
            <th>Type</th>
            <th>Statut</th>
            <th>Document</th>
        </tr>
    </thead>

    <tbody id="listeDemandes"></tbody>
</table>

<script>
const citoyen_id = localStorage.getItem("citoyen_id");

fetch("/mes_demandes/" + citoyen_id)
.then(res => res.json())
.then(data => {

    let html = "";

    data.forEach(d => {

        html += `
        <tr>
            <td>${d[0]}</td>
            <td>${d[1]}</td>
            <td>${d[2]}</td>
            <td>${d[3] ? `<a href="/uploads/${d[3]}" target="_blank">Télécharger</a>` : "Aucun"}</td>
        </tr>
        `;

    });

    document.getElementById("listeDemandes").innerHTML = html;
});
</script>

</body>
</html>
