<!DOCTYPE html>
<html>
<head>
    <title>Mes demandes</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='mairie.css') }}">
</head>
<body>

<h2>Mes demandes</h2>

<table border="1" cellpadding="10">
    <thead>
        <tr>
            <th>ID</th>
            <th>Type de demande</th>
            <th>Statut</th>
            <th>Document</th>
            <th>Notification</th>
        </tr>
    </thead>

    <tbody>
    {% for d in demandes %}
        <tr>
            <td>{{ d[0] }}</td>
            <td>{{ d[1] }}</td>
            <td>{{ d[2] }}</td>
            <td>{{ d[3] }}</td>
            <td>
                {% if d[4] %}
                    {{ d[4] }}
                {% else %}
                    Aucune notification
                {% endif %}
            </td>
        </tr>
    {% endfor %}
    </tbody>
</table>

<br>

<a href="/espace">
    <button>Retour à l'espace citoyen</button>
</a>

</body>
</html>
