<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Espace citoyen</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='mairie.css') }}">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

</head>

<body>

<div class="container py-3">

    <!-- =========================
         ACCUEIL CITOYEN
    ========================== -->

    <h2 class="text-center mb-2">
        Bienvenue, {{ nom }} 👋
    </h2>

    <h3 class="mb-3">
        Mes démarches
    </h3>


    <!-- =========================
         STATISTIQUES
    ========================== -->

    <div class="row g-3 mb-4">

        <div class="col-6 col-md-3">
            <div class="card text-center shadow-sm h-100">
                <div class="card-body">
                    <h5>Total</h5>
                    <h2 id="total">0</h2>
                </div>
            </div>
        </div>


        <div class="col-6 col-md-3">
            <div class="card text-center shadow-sm h-100">
                <div class="card-body">
                    <h5>En attente</h5>
                    <h2 id="attente">0</h2>
                </div>
            </div>
        </div>


        <div class="col-6 col-md-3">
            <div class="card text-center shadow-sm h-100">
                <div class="card-body">
                    <h5>Acceptées</h5>
                    <h2 id="acceptees">0</h2>
                </div>
            </div>
        </div>


        <div class="col-6 col-md-3">
            <div class="card text-center shadow-sm h-100">
                <div class="card-body">
                    <h5>Refusées</h5>
                    <h2 id="refusees">0</h2>
                </div>
            </div>
        </div>

    </div>


    <!-- =========================
         NOTIFICATIONS
    ========================== -->

    <div class="alert alert-info mb-4">

        <h5>
            🔔 Notifications
        </h5>

        <ul id="liste_notifications" class="mb-0">
            <li>Aucune notification.</li>
        </ul>

    </div>


    <!-- =========================
         NOUVELLE DEMANDE
    ========================== -->

    <div class="card shadow-sm mb-4">

        <div class="card-body">

            <h4 class="mb-3">
                Nouvelle demande
            </h4>

            <form id="demandeForm"
                  enctype="multipart/form-data">

                <div class="mb-3">

                    <label for="demande"
                           class="form-label">
                        Type de demande
                    </label>

                    <select id="demande"
                            name="type_demande"
                            class="form-select">

                        <option>Acte de naissance</option>

                        <option>
                            Certificat de résidence
                        </option>

                        <option>
                            Demande d'information
                        </option>

                    </select>

                </div>


                <div class="mb-3">

                    <label for="document"
                           class="form-label">
                        Document
                    </label>

                    <input type="file"
                           id="document"
                           name="document"
                           class="form-control">

                </div>


                <button type="submit"
                        class="btn btn-primary w-100">

                    📤 Envoyer la demande

                </button>

            </form>


            <p id="message"
               class="mt-3 mb-0">
            </p>

        </div>

    </div>


    <!-- =========================
         DERNIÈRES DEMANDES
    ========================== -->

    <h3 class="mb-3">
        Mes dernières demandes
    </h3>


    <div class="table-responsive">

        <table class="table table-bordered table-striped align-middle">

            <thead class="table-primary">

                <tr>

                    <th>Type</th>

                    <th>Statut</th>

                    <th>Notification</th>

                </tr>

            </thead>


            <tbody id="listeDemandes">

            </tbody>

        </table>

    </div>


    <!-- =========================
         BOUTONS
    ========================== -->

    <div class="d-grid gap-2 d-md-flex mt-3">

        <a href="/mes_demandes"
           class="btn btn-primary">

            📄 Voir mes demandes

        </a>


        <a href="/logout"
           class="btn btn-danger">

            🚪 Déconnexion

        </a>

    </div>

</div>


<!-- =========================
     JAVASCRIPT
========================== -->

<script src="{{ url_for('static', filename='script.js') }}"></script>

</body>

</html>
